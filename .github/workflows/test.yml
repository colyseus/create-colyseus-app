name: Test

on:
  push:
    branches: [master, "0.*"]
  pull_request:

jobs:
  smoke:
    name: generate the option matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - run: npm ci

      # Generates every preset, every single-axis variation and the multi-axis
      # combos with stdin closed, then installs, typechecks and runs each
      # generated project's own test suite.
      - run: node scripts/smoke.mjs
